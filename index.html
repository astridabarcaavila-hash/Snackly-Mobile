<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snackly V8 — Pedidos escolares</title>
<meta name="theme-color" content="#16a34a">
<style>
:root{--green:#16a34a;--green2:#15803d;--dark:#12372a;--bg:#f5f8f6;--card:#fff;--line:#e2e8e5;--muted:#64748b;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--shadow:0 10px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#17211d}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px;color:var(--dark)}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#22c55e,#15803d);display:grid;place-items:center;color:white;font-size:22px}.top-actions{display:flex;gap:8px;align-items:center}.container{max-width:1180px;margin:auto;padding:24px 16px 70px}.hero{background:linear-gradient(135deg,#eaf8ee,#fff);border:1px solid #d8eedf;border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px)}.hero p{margin:0;color:#527064}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.grid3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.role-card{min-height:170px;display:flex;flex-direction:column;justify-content:space-between}.role-icon{font-size:42px}.role-card h3{margin:8px 0 4px}.muted{color:var(--muted)}.btn{padding:11px 15px;border-radius:11px;font-weight:800}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green2)}.secondary{background:#eef5f0;color:var(--dark)}.danger{background:#fee2e2;color:#991b1b}.outline{background:#fff;border:1px solid var(--line);color:#26372f}.small{font-size:13px;padding:8px 10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-title h2{margin:0;font-size:21px}.stat{padding:17px;border-radius:16px;background:#fff;border:1px solid var(--line)}.stat .num{font-size:27px;font-weight:900;margin-top:5px}.stat .label{font-size:13px;color:var(--muted)}.green{color:var(--green2)}.blue{color:var(--blue)}.amber{color:var(--amber)}.red{color:var(--red)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:750;font-size:14px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfdad4;border-radius:10px;padding:11px 12px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.notice{padding:13px 15px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.warning{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8faf9;color:#52635b}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.b-green{background:#dcfce7;color:#166534}.b-red{background:#fee2e2;color:#991b1b}.b-amber{background:#fef3c7;color:#92400e}.b-blue{background:#dbeafe;color:#1d4ed8}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--dark);color:#fff}.product{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px}.price{font-weight:900}.empty{text-align:center;padding:28px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#12372a;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:100}.hidden{display:none!important}.back{margin-bottom:14px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:grid;place-items:center;padding:16px;z-index:50}.modal-card{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.25)}.modal-card h2{margin-top:0}.footer{padding:25px 16px;color:#64748b;text-align:center;font-size:12px}.admin-link{color:#64748b;text-decoration:underline;cursor:pointer}.kpi-note{font-size:12px;color:#64748b;margin-top:6px}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}.check input{margin-top:3px}.payment-card{border:1px dashed #b8c9bf;background:#fbfdfb;border-radius:15px;padding:15px}.sub-status{font-size:20px;font-weight:900}.timeline{display:grid;gap:9px}.timeline-item{display:flex;gap:10px;align-items:flex-start}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);margin-top:5px;flex:0 0 auto}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.container{padding:16px 12px 55px}.hero{padding:20px}.topbar{padding:10px 12px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY='snackly_v8_db';
const seed={settings:{simulationDate:new Date().toISOString().slice(0,10),adminPin:'SNK-ADMIN-2026'},products:[{id:'P1',name:'Combo Power',price:5.00},{id:'P2',name:'Pan con pollo',price:3.50},{id:'P3',name:'Jugo de maracuyá',price:2.50},{id:'P4',name:'Fruta picada',price:2.00}],kiosks:[],users:[],students:[],orders:[],payments:[],deliveries:[],subscriptions:[],commissions:[],visits:[],installations:[],ratings:[]};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=load();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function money(n){return 'S/ '+Number(n||0).toFixed(2)}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function today(){return db.settings.simulationDate||new Date().toISOString().slice(0,10)}
function addMonths(dateStr,n){let d=new Date(dateStr+'T00:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function daysDiff(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(status){const map={Entregado:'b-green',Confirmado:'b-green',Activa:'b-green',Prueba:'b-blue',Pendiente:'b-amber',Cancelado:'b-red',Vencida:'b-red',Programado:'b-amber',Preparado:'b-blue'};return `<span class="badge ${map[status]||'b-blue'}">${esc(status)}</span>`}
function setView(html){document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
function layout(content,back=true,title='Snackly'){setView(`<header class="topbar"><div class="brand"><div class="logo">🥪</div>Snackly</div><div class="top-actions"><button class="btn small secondary" onclick="home()">Inicio</button></div></header><main class="container">${back?'<button class="btn small outline back" onclick="home()">← Volver</button>':''}${content}</main><footer class="footer">Snackly · Pedidos escolares anticipados · <span class="admin-link" onclick="adminLogin()">Administración Snackly</span></footer>`)}
function home(){setView(`<header class="topbar"><div class="brand"><div class="logo">🥪</div>Snackly</div></header><main class="container"><section class="hero"><h1>Snackly</h1><p>Pedidos escolares reservados y pagados anticipadamente.</p></section><div class="grid grid2"><div class="card role-card"><div><div class="role-icon">🏪</div><h3>Encargado del quiosco</h3><p class="muted">Gestiona pedidos pagados, entregas y reportes del quiosco.</p></div><button class="btn primary" onclick="kioskEntry()">Ingresar</button></div><div class="card role-card"><div><div class="role-icon">🏫</div><h3>Comunidad educativa</h3><p class="muted">Padres de familia, estudiantes y personal de la institución.</p></div><button class="btn primary" onclick="community()">Ingresar</button></div></div><div class="card" style="margin-top:16px"><strong>Modelo de Snackly</strong><p class="muted">Los pedidos se reservan con anticipación y se registran únicamente cuando el pago digital ha sido confirmado.</p></div></main><footer class="footer">Snackly · <span class="admin-link" onclick="adminLogin()">Administración Snackly</span></footer>`)}
function kioskEntry(){layout(`<section class="hero"><h1>🏪 Encargado del quiosco</h1><p>Ingresa sin contraseña. Si es la primera vez, registra los datos del responsable y del quiosco.</p></section><div class="grid grid2"><div class="card"><h2>Ingresar</h2><div class="field"><label>Correo electrónico</label><input id="kemail" type="email" placeholder="quiosco@gmail.com"></div><div class="field" style="margin-top:12px"><label>Código del quiosco</label><input id="kcode" placeholder="SNK-0001"></div><div class="actions"><button class="btn primary" onclick="kioskLogin()">Ingresar al panel</button><button class="btn secondary" onclick="kioskRegister()">Registrar quiosco</button></div></div><div class="card"><h2>¿Qué registra Snackly?</h2><ul class="muted"><li>Pedidos realizados y pagados anticipadamente</li><li>Pedidos entregados y cancelados</li><li>Ventas cobradas</li><li>Historial diario y mensual</li><li>Reportes Excel</li></ul></div></div>`)}
function kioskRegister(){layout(`<section class="hero"><h1>🏪 Registrar quiosco</h1><p>Completa los datos del responsable y de la institución educativa.</p></section><div class="card"><div class="form-grid"><div class="field"><label>Nombres *</label><input id="rname"></div><div class="field"><label>Apellidos *</label><input id="rlast"></div><div class="field"><label>Tipo de responsable *</label><select id="rtype"><option>Propietario/a</option><option>Encargado/a</option><option>Administrador/a</option></select></div><div class="field"><label>DNI *</label><input id="rdni" inputmode="numeric"></div><div class="field"><label>Celular *</label><input id="rphone" inputmode="tel"></div><div class="field"><label>Correo electrónico *</label><input id="remail" type="email"></div><div class="field full"><label>Nombre del quiosco *</label><input id="r kiosk" oninput="this.id='rkiosk'" placeholder="Ej. Quiosco Saludable"></div><div class="field full"><label>Nombre de la institución educativa *</label><input id="rschool"></div><div class="field"><label>Fecha de registro *</label><input id="rdate" type="date" value="${today()}"></div><div class="field"><label>Código Snackly</label><input value="Se genera automáticamente" disabled></div></div><div class="notice" style="margin-top:16px"><strong>Suscripción:</strong> primer mes gratis. Después, S/ 3.00 mensuales con cobro automático al método de pago registrado.</div><div class="actions"><button class="btn primary" onclick="startSubscriptionForm()">Continuar a suscripción</button></div></div>`)}
function startSubscriptionForm(){const fields=['rname','rlast','rtype','rdni','rphone','remail','rkiosk','rschool','rdate'];for(const f of fields){if(!document.getElementById(f)?.value){toast('Completa todos los campos obligatorios');return}}const data={name:document.getElementById('rname').value,last:document.getElementById('rlast').value,type:document.getElementById('rtype').value,dni:document.getElementById('rdni').value,phone:document.getElementById('rphone').value,email:document.getElementById('remail').value,kiosk:document.getElementById('rkiosk').value,school:document.getElementById('rschool').value,date:document.getElementById('rdate').value};subscriptionModal(data)}
function subscriptionModal(data){const end=addMonths(data.date,1);document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><h2>💳 Confirmar suscripción</h2><p><strong>Plan Snackly Quiosco</strong></p><div class="payment-card"><div class="sub-status green">🎁 Primer mes gratis</div><p>Después del periodo gratuito:</p><h2>${money(3)} mensuales</h2><p>El importe será cobrado automáticamente cada mes al método de pago registrado mientras la suscripción permanezca activa.</p><p><strong>Primer cobro:</strong> ${fmtDate(end)}</p><div class="field"><label>Tarjeta registrada</label><input id="cardholder" placeholder="Nombre del titular"><input id="cardnumber" maxlength="19" placeholder="Número de tarjeta" style="margin-top:7px"><div class="form-grid" style="margin-top:7px"><input id="expiry" placeholder="MM/AA"><input id="cvv" maxlength="4" placeholder="CVV"></div></div></div><div style="margin-top:14px"><label class="check"><input id="terms" type="checkbox"> <span>He leído y acepto los Términos y Condiciones.</span></label><label class="check" style="margin-top:9px"><input id="auto" type="checkbox"> <span>Acepto el cobro automático mensual de ${money(3)} y las condiciones de cancelación.</span></label></div><div class="actions"><button class="btn primary" onclick='finishKioskRegistration(${JSON.stringify(data)})'>Suscribirme</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function finishKioskRegistration(data){if(!document.getElementById('terms').checked||!document.getElementById('auto').checked){toast('Debes aceptar las condiciones de suscripción');return}const num=document.getElementById('cardnumber').value.replace(/\s/g,'');if(num.length<8){toast('Registra una tarjeta para continuar');return}const kiosk={id:id('KQ'),code:'SNK-'+String(db.kiosks.length+1).padStart(4,'0'),name:data.kiosk,school:data.school,responsible:data.name+' '+data.last,responsibleType:data.type,dni:data.dni,phone:data.phone,email:data.email,registrationDate:data.date,status:'Activo',createdAt:new Date().toISOString()};db.kiosks.push(kiosk);db.users.push({id:id('USR'),name:data.name+' '+data.last,email:data.email,role:'Responsable de quiosco',kioskId:kiosk.id,createdAt:data.date});const masked='•••• '+num.slice(-4);const sub={id:id('SUB'),kioskId:kiosk.id,email:data.email,plan:'Snackly Quiosco',price:3,trialStart:data.date,trialEnd:addMonths(data.date,1),status:'Prueba',nextCharge:addMonths(data.date,1),cardMasked:masked,cardHolder:document.getElementById('cardholder').value||data.name+' '+data.last,termsAcceptedAt:new Date().toISOString(),autoRenew:true,history:[]};db.subscriptions.push(sub);save();closeModal();toast('Quiosco registrado correctamente');kioskDashboard(kiosk.id)}
function kioskLogin(){const email=document.getElementById('kemail').value.trim().toLowerCase(),code=document.getElementById('kcode').value.trim().toUpperCase();const k=db.kiosks.find(x=>x.email.toLowerCase()===email&&x.code===code);if(!k){toast('No encontramos ese quiosco. Verifica correo y código.');return}kioskDashboard(k.id)}
function kioskDashboard(kid){const k=db.kiosks.find(x=>x.id===kid), range=getRange(today(),'day'), orders=db.orders.filter(o=>o.kioskId===kid&&o.date>=range.start&&o.date<=range.end), confirmed=orders.filter(o=>o.paymentStatus==='Confirmado'), delivered=orders.filter(o=>o.status==='Entregado'), canceled=orders.filter(o=>o.status==='Cancelado'), sales=confirmed.reduce((s,o)=>s+o.total,0);layout(`<section class="hero"><h1>🏪 ${esc(k.name)}</h1><p>${esc(k.school)} · ${esc(k.responsible)}</p><div class="pill-row" style="margin-top:10px"><span class="badge b-green">${esc(k.code)}</span><span class="badge b-blue">Solo pagos digitales</span></div></section><div class="section-title"><h2>Resumen de hoy · ${fmtDate(today())}</h2><button class="btn small secondary" onclick="kioskRegisterOrder('${kid}')">+ Registrar pedido pagado</button></div><div class="grid grid3"><div class="stat"><div class="label">📦 Pedidos realizados</div><div class="num">${orders.length}</div></div><div class="stat"><div class="label">✅ Pedidos entregados</div><div class="num green">${delivered.length}</div></div><div class="stat"><div class="label">❌ Pedidos cancelados</div><div class="num red">${canceled.length}</div></div><div class="stat"><div class="label">💳 Ventas cobradas</div><div class="num">${money(sales)}</div></div><div class="stat"><div class="label">💵 Ingreso neto del quiosco</div><div class="num green">${money(sales)}</div><div class="kpi-note">Pedidos pagados digitalmente y confirmados.</div></div><div class="stat"><div class="label">⏳ Pendientes</div><div class="num amber">${orders.filter(o=>o.status==='Pendiente'||o.status==='Preparado').length}</div></div></div><div class="section-title"><h2>Pedidos del quiosco</h2><div class="pill-row"><button class="btn small secondary" onclick="kioskReport('${kid}')">📥 Excel mensual</button></div></div>${ordersTable(orders,true)}<div class="section-title"><h2>Suscripción</h2></div>${subscriptionCard(kid)}<div class="notice" style="margin-top:16px">La Comisión Snackly no se muestra en este panel. Es información exclusiva de Administración Snackly.</div>`)}
function subscriptionCard(kid){const s=db.subscriptions.find(x=>x.kioskId===kid);if(!s)return '<div class="card">Sin suscripción.</div>';let status=s.status;if(s.status==='Prueba'&&today()>=s.trialEnd)status='Activa';return `<div class="card"><div class="grid grid2"><div><div class="muted">Estado</div><div class="sub-status">${badge(status)}</div><p><strong>Plan:</strong> ${s.plan}</p><p><strong>Precio:</strong> ${money(s.price)} / mes</p><p><strong>Método:</strong> ${esc(s.cardMasked)}</p><p><strong>Próximo cobro:</strong> ${fmtDate(s.nextCharge)}</p></div><div><h3>Administrar suscripción</h3><p class="muted">La renovación mensual queda registrada en el historial de la cuenta.</p><button class="btn danger" onclick="cancelSubscription('${s.id}')">Cancelar suscripción</button></div></div></div>`}
function cancelSubscription(sid){const s=db.subscriptions.find(x=>x.id===sid);if(!s)return;showConfirm('Cancelar suscripción','Si cancelas, no se generarán nuevos cobros y el historial permanecerá registrado.',()=>{s.status='Cancelada';s.autoRenew=false;s.canceledAt=today();save();toast('Suscripción cancelada');kioskDashboard(s.kioskId)})}
function kioskRegisterOrder(kid){layout(`<section class="hero"><h1>📦 Registrar pedido</h1><p>Snackly registra exclusivamente pedidos reservados y pagados anticipadamente.</p></section><div class="card"><div class="form-grid"><div class="field"><label>Fecha</label><input id="odate" type="date" value="${today()}"></div><div class="field"><label>Estudiante</label><input id="ostudent" placeholder="Nombre del estudiante"></div><div class="field"><label>Producto</label><select id="oproduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="oqty" type="number" min="1" value="1"></div><div class="field"><label>Referencia de pago digital</label><input id="oref" placeholder="Ej. 458721"></div><div class="field"><label>Hora de recojo</label><select id="otime"><option>09:45</option><option>09:50</option><option>09:55</option><option>10:00</option><option>12:45</option></select></div></div><div class="notice" style="margin-top:14px">💳 Pago anticipado digital obligatorio. No se registran pagos en efectivo.</div><div class="actions"><button class="btn primary" onclick="createOrder('${kid}')">Guardar pedido pagado</button><button class="btn secondary" onclick="kioskDashboard('${kid}')">Cancelar</button></div></div>`)}
function createOrder(kid){const date=document.getElementById('odate').value,student=document.getElementById('ostudent').value.trim(),pid=document.getElementById('oproduct').value,qty=Number(document.getElementById('oqty').value),ref=document.getElementById('oref').value.trim();if(!date||!student||!qty||!ref){toast('Completa los datos del pedido y la referencia de pago');return}const p=db.products.find(x=>x.id===pid),total=p.price*qty,o={id:id('ORD'),code:'SQ-'+String(db.orders.length+1).padStart(5,'0'),kioskId:kid,date,time:new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),student,product:p.name,productId:pid,qty,unitPrice:p.price,total,paymentMethod:'Pago digital',paymentReference:ref,paymentStatus:'Confirmado',status:'Pendiente',pickup:document.getElementById('otime').value};db.orders.push(o);db.payments.push({id:id('PAY'),orderId:o.id,kioskId:kid,date,amount:total,method:'Pago digital',reference:ref,status:'Confirmado'});save();toast('Pedido registrado y pago confirmado');kioskDashboard(kid)}
function ordersTable(orders,actions=false){if(!orders.length)return '<div class="card empty">No hay pedidos registrados para este periodo.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Pedido</th><th>Fecha</th><th>Estudiante</th><th>Producto</th><th>Total</th><th>Pago</th><th>Estado</th>${actions?'<th>Acciones</th>':''}</tr></thead><tbody>${orders.map(o=>`<tr><td><strong>${esc(o.code)}</strong></td><td>${fmtDate(o.date)}</td><td>${esc(o.student)}</td><td>${esc(o.product)} × ${o.qty}</td><td>${money(o.total)}</td><td>${badge(o.paymentStatus)}</td><td>${badge(o.status)}</td>${actions?`<td>${o.status==='Pendiente'?`<button class="btn small primary" onclick="deliverOrder('${o.id}')">Entregar</button> <button class="btn small danger" onclick="cancelOrder('${o.id}')">Cancelar</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function deliverOrder(oid){const o=db.orders.find(x=>x.id===oid);if(!o)return;o.status='Entregado';o.deliveredAt=new Date().toISOString();db.deliveries.push({id:id('DEL'),orderId:oid,kioskId:o.kioskId,date:o.date,time:new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),status:'Entregado'});save();toast('Pedido marcado como entregado');kioskDashboard(o.kioskId)}
function cancelOrder(oid){const o=db.orders.find(x=>x.id===oid);if(!o)return;showConfirm('Cancelar pedido','El pedido quedará registrado como cancelado y no se eliminará del historial.',()=>{o.status='Cancelado';save();toast('Pedido cancelado');kioskDashboard(o.kioskId)})}

function getRange(ref,mode){if(mode==='day')return{start:ref,end:ref};const d=new Date(ref+'T00:00:00');if(mode==='month'){const start=new Date(d.getFullYear(),d.getMonth(),1),end=new Date(d.getFullYear(),d.getMonth()+1,0);return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10)}}if(mode==='7'){const start=new Date(d);start.setDate(d.getDate()-6);return{start:start.toISOString().slice(0,10),end:ref}}return{start:ref,end:ref}}
function kioskReport(kid){const range=getRange(today(),'month'),orders=db.orders.filter(o=>o.kioskId===kid&&o.date>=range.start&&o.date<=range.end);downloadWorkbook({Pedidos:orders.map(o=>({Pedido:o.code,Fecha:o.date,Hora:o.time,Estudiante:o.student,Producto:o.product,Cantidad:o.qty,PrecioUnitario:o.unitPrice,Total:o.total,Pago:o.paymentMethod,Referencia:o.paymentReference,EstadoPago:o.paymentStatus,EstadoPedido:o.status,Recojo:o.pickup})),Resumen:[{Mes:range.start+' a '+range.end,'Pedidos realizados':orders.length,'Entregados':orders.filter(o=>o.status==='Entregado').length,'Cancelados':orders.filter(o=>o.status==='Cancelado').length,'Ventas cobradas':orders.filter(o=>o.paymentStatus==='Confirmado').reduce((s,o)=>s+o.total,0),'Ingreso neto del quiosco':orders.filter(o=>o.paymentStatus==='Confirmado').reduce((s,o)=>s+o.total,0)}]},'Reporte_Quiosco_'+range.start.slice(0,7)+'.xlsx')}

function checkAdmin(){if(document.getElementById('apin').value!==db.settings.adminPin){toast('Código incorrecto');return}closeModal();adminDashboard()}
function adminDashboard(){processSubscriptions();const month=getRange(today(),'month'),orders=db.orders.filter(o=>o.date>=month.start&&o.date<=month.end),confirmed=orders.filter(o=>o.paymentStatus==='Confirmado'),comm=db.commissions.filter(c=>c.date>=month.start&&c.date<=month.end),subs=db.subscriptions.filter(s=>s.status==='Activa'||s.status==='Prueba'),activeK=db.kiosks.filter(k=>k.status==='Activo');const visits=db.visits.filter(v=>v.date>=month.start&&v.date<=month.end).length,inst=db.installations.filter(v=>v.date>=month.start&&v.date<=month.end).length,subscriptionIncome=comm.length?0:0;const subPayments=db.subscriptions.flatMap(s=>s.history||[]).filter(h=>h.date>=month.start&&h.date<=month.end&&h.status==='Pagado');const snackIncome=comm.reduce((s,c)=>s+c.amount,0)+subPayments.reduce((s,p)=>s+p.amount,0);setView(`<header class="topbar"><div class="brand"><div class="logo">🛡️</div>Administración Snackly</div><div class="top-actions"><button class="btn small secondary" onclick="home()">Salir</button></div></header><main class="container"><section class="hero"><h1>🛡️ Administración Snackly</h1><p>Centro de control de los estudiantes emprendedores y su asesor.</p><div class="notice" style="margin-top:14px"><strong>Persistencia:</strong> los datos permanecen guardados en este navegador y no se eliminan automáticamente. Solo la administración puede ejecutar una limpieza explícita.</div></section><div class="grid grid3"><div class="stat"><div class="label">🏪 Quioscos</div><div class="num">${activeK.length}</div></div><div class="stat"><div class="label">📦 Pedidos del mes</div><div class="num">${orders.length}</div></div><div class="stat"><div class="label">💳 Pagos confirmados</div><div class="num green">${confirmed.length}</div></div><div class="stat"><div class="label">💰 Comisiones</div><div class="num">${money(comm.reduce((s,c)=>s+c.amount,0))}</div></div><div class="stat"><div class="label">💼 Suscripciones activas</div><div class="num">${subs.filter(s=>s.status==='Activa').length}</div></div><div class="stat"><div class="label">💵 Ingresos Snackly</div><div class="num">${money(snackIncome)}</div></div><div class="stat"><div class="label">👁️ Visitas del mes</div><div class="num">${visits}</div></div><div class="stat"><div class="label">📲 Instalaciones</div><div class="num">${inst}</div></div></div><div class="section-title"><h2>Fecha de simulación y pruebas</h2></div><div class="card"><div class="form-grid"><div class="field"><label>Fecha de simulación</label><input id="simdate" type="date" value="${today()}"></div><div class="field"><label>Acción</label><button class="btn primary" onclick="setSimDate()">Actualizar fecha</button></div></div><p class="kpi-note">Puedes colocar una fecha anterior para probar periodos de prueba, cobros mensuales y reportes históricos.</p></div><div class="section-title"><h2>Gestión</h2></div><div class="tabs"><button class="btn active" onclick="adminSection('kiosks')">🏪 Quioscos</button><button class="btn" onclick="adminSection('subs')">💳 Suscripciones</button><button class="btn" onclick="adminSection('comm')">💰 Comisiones</button><button class="btn" onclick="adminSection('orders')">📦 Pedidos</button><button class="btn" onclick="adminSection('users')">👥 Usuarios</button><button class="btn" onclick="adminSection('usage')">👁️ Visitas</button><button class="btn" onclick="adminSection('reports')">📊 Reportes</button><button class="btn" onclick="adminSection('data')">⚙️ Datos</button></div><div id="adminSection"></div></main><footer class="footer">Snackly Administración · datos persistentes · exportación Excel</footer>`);adminSection('kiosks')}
function processSubscriptions(){for(const s of db.subscriptions){if(s.status==='Cancelada')continue;if(today()<s.trialEnd){s.status='Prueba';s.nextCharge=s.trialEnd;continue}if(!s.nextCharge)s.nextCharge=s.trialEnd;while(today()>=s.nextCharge&&s.autoRenew){s.history=s.history||[];if(!s.history.some(h=>h.date===s.nextCharge&&h.amount===3)){s.history.push({date:s.nextCharge,amount:3,status:'Pagado',card:s.cardMasked})}s.nextCharge=addMonths(s.nextCharge,1);s.status='Activa'}if(today()>=s.trialEnd)s.status='Activa'}save()}
function setSimDate(){const d=document.getElementById('simdate').value;if(!d)return;db.settings.simulationDate=d;save();processSubscriptions();toast('Fecha de simulación actualizada');adminDashboard()}
function adminSection(sec){const el=document.getElementById('adminSection');if(!el)return;const month=getRange(today(),'month');if(sec==='kiosks'){el.innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">Quioscos registrados</h2><button class="btn small secondary" onclick="kioskRegister()">+ Nuevo quiosco</button></div>${db.kiosks.length?`<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Código</th><th>Quiosco</th><th>Institución</th><th>Responsable</th><th>Correo</th><th>Registro</th><th>Estado</th></tr></thead><tbody>${db.kiosks.map(k=>`<tr><td>${k.code}</td><td>${esc(k.name)}</td><td>${esc(k.school)}</td><td>${esc(k.responsible)}</td><td>${esc(k.email)}</td><td>${fmtDate(k.registrationDate)}</td><td>${badge(k.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay quioscos registrados.</div>'}</div>`}else if(sec==='subs'){el.innerHTML=`<div class="card"><h2>Suscripciones</h2>${db.subscriptions.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Quiosco</th><th>Correo</th><th>Registro</th><th>Prueba hasta</th><th>Estado</th><th>Próximo cobro</th><th>Método</th></tr></thead><tbody>${db.subscriptions.map(s=>{const k=db.kiosks.find(x=>x.id===s.kioskId);return `<tr><td>${esc(k?.name||'')}</td><td>${esc(s.email)}</td><td>${fmtDate(k?.registrationDate)}</td><td>${fmtDate(s.trialEnd)}</td><td>${badge(s.status)}</td><td>${fmtDate(s.nextCharge)}</td><td>${esc(s.cardMasked)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay suscripciones.</div>'}</div>`}else if(sec==='comm'){const comm=db.commissions.filter(c=>c.date>=month.start&&c.date<=month.end);el.innerHTML=`<div class="card"><div class="section-title"><h2>💰 Comisiones Snackly · ${month.start.slice(0,7)}</h2><button class="btn small secondary" onclick="exportCommissions()">📥 Excel</button></div><div class="notice"><strong>${money(comm.reduce((s,c)=>s+c.amount,0))}</strong> generados este mes por ${comm.length} pagos digitales confirmados.</div><div style="margin-top:14px">${comm.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Quiosco</th><th>Pedido</th><th>Monto pedido</th><th>Comisión</th></tr></thead><tbody>${comm.map(c=>{const k=db.kiosks.find(x=>x.id===c.kioskId);return `<tr><td>${fmtDate(c.date)}</td><td>${esc(k?.name||'')}</td><td>${esc(c.orderCode)}</td><td>${money(c.orderAmount)}</td><td><strong>${money(c.amount)}</strong></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay comisiones generadas.</div>'}</div></div>`}else if(sec==='orders'){const orders=db.orders.filter(o=>o.date>=month.start&&o.date<=month.end);el.innerHTML=`<div class="card"><div class="section-title"><h2>📦 Pedidos · ${month.start.slice(0,7)}</h2><button class="btn small secondary" onclick="exportAllOrders()">📥 Excel</button></div>${ordersTable(orders,false)}</div>`}else if(sec==='users'){el.innerHTML=`<div class="card"><h2>👥 Usuarios registrados</h2>${db.users.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Institución</th><th>Registro</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.school||'—')}</td><td>${fmtDate(u.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay usuarios registrados.</div>'}</div>`}else if(sec==='usage'){el.innerHTML=`<div class="grid grid2"><div class="card"><h2>👁️ Visitas</h2><div class="num" style="font-size:36px">${db.visits.filter(v=>v.date>=month.start&&v.date<=month.end).length}</div><p class="muted">Visitas registradas este mes.</p></div><div class="card"><h2>📲 Instalaciones</h2><div class="num" style="font-size:36px">${db.installations.filter(v=>v.date>=month.start&&v.date<=month.end).length}</div><p class="muted">Instalaciones registradas este mes.</p></div></div><div class="card" style="margin-top:16px"><h2>Datos de demostración</h2><p class="muted">Puedes generar visitas e instalaciones de prueba para presentar el funcionamiento.</p><div class="actions"><button class="btn secondary" onclick="simulateUsage(25,5)">+25 visitas / +5 instalaciones</button><button class="btn outline" onclick="simulateUsage(100,20)">+100 visitas / +20 instalaciones</button></div></div>`}else if(sec==='reports'){el.innerHTML=`<div class="grid grid2"><div class="card"><h2>📊 Reporte general mensual</h2><p class="muted">Pedidos, pagos, comisiones, suscripciones y usuarios.</p><button class="btn primary" onclick="exportGeneral()">Descargar Excel</button></div><div class="card"><h2>💳 Suscripciones</h2><p class="muted">Listado e historial mensual de suscripciones.</p><button class="btn secondary" onclick="exportSubscriptions()">Descargar Excel</button></div><div class="card"><h2>👥 Usuarios</h2><button class="btn secondary" onclick="exportUsers()">Descargar Excel</button></div><div class="card"><h2>💰 Comisiones</h2><button class="btn secondary" onclick="exportCommissions()">Descargar Excel</button></div></div>`}else if(sec==='data'){el.innerHTML=`<div class="card"><h2>⚙️ Gestión de datos</h2><p>Los registros permanecen guardados hasta que la administración decida limpiarlos.</p><div class="actions"><button class="btn secondary" onclick="exportGeneral()">📥 Copia Excel general</button><button class="btn danger" onclick="clearData()">🗑️ Limpiar datos de demostración</button></div><div class="warning" style="margin-top:14px">La limpieza es una acción explícita de administración. No se ejecuta automáticamente y elimina los registros guardados en este prototipo.</div></div>`}}

function kioskRegister(){layout(`<section class="hero"><h1>🏪 Registrar nuevo quiosco</h1><p>Registro administrativo del responsable y de la institución.</p></section><div class="card"><div class="form-grid"><div class="field"><label>Nombres *</label><input id="rname"></div><div class="field"><label>Apellidos *</label><input id="rlast"></div><div class="field"><label>Tipo de responsable *</label><select id="rtype"><option>Propietario/a</option><option>Encargado/a</option><option>Administrador/a</option></select></div><div class="field"><label>DNI *</label><input id="rdni"></div><div class="field"><label>Celular *</label><input id="rphone"></div><div class="field"><label>Correo electrónico *</label><input id="remail" type="email"></div><div class="field full"><label>Nombre del quiosco *</label><input id="rkiosk"></div><div class="field full"><label>Nombre de la institución educativa *</label><input id="rschool"></div><div class="field"><label>Fecha de registro *</label><input id="rdate" type="date" value="${today()}"></div></div><div class="notice" style="margin-top:16px"><strong>Suscripción:</strong> primer mes gratis y luego ${money(3)} mensuales.</div><div class="actions"><button class="btn primary" onclick="startSubscriptionForm()">Continuar a suscripción</button></div></div>`)}
function exportCommissions(){const m=getRange(today(),'month');downloadWorkbook({Comisiones:db.commissions.filter(c=>c.date>=m.start&&c.date<=m.end).map(c=>({Fecha:c.date,Quiosco:db.kiosks.find(k=>k.id===c.kioskId)?.name||'',Pedido:c.orderCode,MontoPedido:c.orderAmount,Comision:c.amount}))},'Comisiones_Snackly_'+m.start.slice(0,7)+'.xlsx')}
function exportSubscriptions(){downloadWorkbook({Suscripciones:db.subscriptions.map(s=>({Quiosco:db.kiosks.find(k=>k.id===s.kioskId)?.name||'',Correo:s.email,Registro:db.kiosks.find(k=>k.id===s.kioskId)?.registrationDate||'',PruebaHasta:s.trialEnd,Estado:s.status,ProximoCobro:s.nextCharge,Precio:s.price,Tarjeta:s.cardMasked})),Cobros:db.subscriptions.flatMap(s=>(s.history||[]).map(h=>({Quiosco:db.kiosks.find(k=>k.id===s.kioskId)?.name||'',Fecha:h.date,Monto:h.amount,Estado:h.status,Tarjeta:s.cardMasked})))},'Suscripciones_Snackly.xlsx')}
function exportUsers(){downloadWorkbook({Usuarios:db.users.map(u=>({Nombre:u.name,Correo:u.email,Rol:u.role,Institucion:u.school||'',Registro:u.createdAt}))},'Usuarios_Snackly.xlsx')}
function exportAllOrders(){const m=getRange(today(),'month');downloadWorkbook({Pedidos:db.orders.filter(o=>o.date>=m.start&&o.date<=m.end).map(o=>({Pedido:o.code,Fecha:o.date,Hora:o.time,Quiosco:db.kiosks.find(k=>k.id===o.kioskId)?.name||'',Estudiante:o.student,Producto:o.product,Cantidad:o.qty,Total:o.total,Pago:o.paymentMethod,Referencia:o.paymentReference,EstadoPago:o.paymentStatus,EstadoPedido:o.status,Recojo:o.pickup}))},'Pedidos_Snackly_'+m.start.slice(0,7)+'.xlsx')}
function exportGeneral(){const m=getRange(today(),'month'),orders=db.orders.filter(o=>o.date>=m.start&&o.date<=m.end),comm=db.commissions.filter(c=>c.date>=m.start&&c.date<=m.end);downloadWorkbook({Resumen:[{Periodo:m.start+' a '+m.end,Quioscos:db.kiosks.length,Usuarios:db.users.length,Pedidos:orders.length,Entregados:orders.filter(o=>o.status==='Entregado').length,Cancelados:orders.filter(o=>o.status==='Cancelado').length,VentasCobradas:orders.filter(o=>o.paymentStatus==='Confirmado').reduce((s,o)=>s+o.total,0),Comisiones:comm.reduce((s,c)=>s+c.amount,0)}],Pedidos:orders.map(o=>({Pedido:o.code,Fecha:o.date,Quiosco:db.kiosks.find(k=>k.id===o.kioskId)?.name||'',Estudiante:o.student,Producto:o.product,Total:o.total,EstadoPago:o.paymentStatus,EstadoPedido:o.status})),Comisiones:comm.map(c=>({Fecha:c.date,Quiosco:db.kiosks.find(k=>k.id===c.kioskId)?.name||'',Pedido:c.orderCode,Comision:c.amount})),Usuarios:db.users.map(u=>({Nombre:u.name,Correo:u.email,Rol:u.role,Registro:u.createdAt}))},'Reporte_General_Snackly_'+m.start.slice(0,7)+'.xlsx')}
function downloadWorkbook(sheets,filename){if(window.XLSX){const wb=XLSX.utils.book_new();for(const [name,rows] of Object.entries(sheets)){const ws=XLSX.utils.json_to_sheet(rows||[]);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))}XLSX.writeFile(wb,filename)}else{const first=Object.values(sheets)[0]||[];const csv=Object.keys(first[0]||{}).join(',')+'\n'+first.map(r=>Object.values(r).map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=filename.replace('.xlsx','.csv');a.click()}}
function simulateUsage(v,i){for(let n=0;n<v;n++)db.visits.push({id:id('VIS'),date:today(),createdAt:new Date().toISOString()});for(let n=0;n<i;n++)db.installations.push({id:id('INS'),date:today(),createdAt:new Date().toISOString()});save();toast('Datos de uso agregados');adminDashboard()}
function clearData(){showConfirm('Limpiar datos','Esta acción eliminará todos los registros guardados del prototipo, excepto la configuración administrativa.',()=>{db={...structuredClone(seed),settings:db.settings};save();toast('Datos limpiados');adminDashboard()})}
function showConfirm(title,msg,ok){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><h2>${esc(title)}</h2><p class="muted">${esc(msg)}</p><div class="actions"><button class="btn danger" id="confirmYes">Confirmar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div></div></div>`;document.getElementById('confirmYes').onclick=()=>{closeModal();ok()}}
function ensureUsage(){const d=today();if(!db.visits.some(v=>v.date===d))db.visits.push({id:id('VIS'),date:d,createdAt:new Date().toISOString()});save()}
// Generate a commission only once per confirmed digital order.
function syncCommissions(){for(const o of db.orders){if(o.paymentStatus==='Confirmado'&&!db.commissions.some(c=>c.orderId===o.id)){db.commissions.push({id:id('COM'),orderId:o.id,kioskId:o.kioskId,orderCode:o.code,orderAmount:o.total,amount:.30,date:o.date})}}save()}
setInterval(()=>{syncCommissions();processSubscriptions()},1000);
ensureUsage();syncCommissions();processSubscriptions();home();
</script>
</body></html>
